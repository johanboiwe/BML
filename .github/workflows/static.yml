name: Build and deploy Doxygen

"on":
  push:
    branches:
      - master
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to build
        required: true
        default: master
        type: string

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake doxygen graphviz

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Generate documentation
        run: doxygen build/Doxyfile

      - name: Determine documentation version
        id: version
        shell: bash
        run: |
          REF="${{ inputs.ref || github.ref_name }}"

          if [[ "$REF" == v* ]]; then
            VERSION="${REF#v}"

            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            echo "Building release documentation: $REF"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "version=master" >> "$GITHUB_OUTPUT"

            echo "Building current documentation: $REF"
          fi

      - name: Generate version selector
        env:
          BUILD_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          python3 .github/scripts/generate_version_selector.py

      - name: Deploy current documentation
        if: steps.version.outputs.release != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docs/html
          keep_files: true

      - name: Deploy release documentation
        if: steps.version.outputs.release == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docs/html
          destination_dir: ${{ steps.version.outputs.version }}
          keep_files: true
