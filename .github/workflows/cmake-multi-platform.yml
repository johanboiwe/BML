name: CMake on multiple platforms

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to build"
        required: true
        default: "master"
        type: string

  push:
    branches: ["master"]

  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++

          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++

          - os: ubuntu-24.04-arm
            c_compiler: gcc
            cpp_compiler: g++

          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++

          - os: macos-15-intel
            c_compiler: clang
            cpp_compiler: clang++

          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Configure CMake
        run: >
          cmake -B build
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=Release
          -S .

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        working-directory: build
        run: ctest --build-config Release --output-on-failure

      - name: Install
        run: cmake --install build --prefix install --config Release


  build-32bit-linux:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Install 32-bit dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Configure CMake
        run: >
          cmake -B build-32
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_C_FLAGS=-m32
          -DCMAKE_CXX_FLAGS=-m32
          -DCMAKE_BUILD_TYPE=Release
          -S .

      - name: Build
        run: cmake --build build-32 --config Release

      - name: Test
        working-directory: build-32
        run: ctest --build-config Release --output-on-failure

      - name: Install
        run: cmake --install build-32 --prefix install --config Release


  build-32bit-windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Configure CMake
        run: >
          cmake -B build-32
          -A Win32
          -DCMAKE_BUILD_TYPE=Release
          -S .

      - name: Build
        run: cmake --build build-32 --config Release

      - name: Test
        working-directory: build-32
        run: ctest --build-config Release --output-on-failure

      - name: Install
        run: cmake --install build-32 --prefix install --config Release
